name: Flow CI-Test
run-name: "Flow CI-Test"

on:
  push:
    branches: [master, development, feature/*]
  pull_request:
    branches: [master, development, feature/*]

jobs:
  lint:
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort
          
      - name: Run linting
        run: |
          flake8 binance_trader_api/
          black binance_trader_api/ --check
          isort binance_trader_api/ --check-only

  test:
    runs-on: ubuntu-latest
    needs: lint
    environment: development
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install Docker Compose
        run: |
          sudo curl -L "https://github.com/docker/compose/releases/download/$(curl -s https://api.github.com/repos/docker/compose/releases/latest | jq -r .tag_name)/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
          sudo chmod +x /usr/local/bin/docker-compose

      - name: Generate .env file
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          BINANCE_TRADER_API_DB_NAME: ${{ secrets.BINANCE_TRADER_API_DB_NAME }}
          BINANCE_TRADER_API_DB_USER: ${{ secrets.BINANCE_TRADER_API_DB_USER }}
          BINANCE_TRADER_API_DB_PASSWORD: ${{ secrets.BINANCE_TRADER_API_DB_PASSWORD }}
          BINANCE_TRADER_API_DB_HOST: ${{ secrets.BINANCE_TRADER_API_DB_HOST }}
          BINANCE_TRADER_API_DB_PORT: ${{ secrets.BINANCE_TRADER_API_DB_PORT }}
        run: |
          echo "POSTGRES_HOST=${POSTGRES_HOST}" >> .env
          echo "POSTGRES_PORT=${POSTGRES_PORT}" >> .env
          echo "POSTGRES_USER=${POSTGRES_USER}" >> .env
          echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}" >> .env
          echo "POSTGRES_DB=${POSTGRES_DB}" >> .env
          echo "DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}" >> .env
          echo "BINANCE_TRADER_API_DB_NAME=${BINANCE_TRADER_API_DB_NAME}" >> .env
          echo "BINANCE_TRADER_API_DB_USER=${BINANCE_TRADER_API_DB_USER}" >> .env
          echo "BINANCE_TRADER_API_DB_PASSWORD=${BINANCE_TRADER_API_DB_PASSWORD}" >> .env
          echo "BINANCE_TRADER_API_DB_HOST=${BINANCE_TRADER_API_DB_HOST}" >> .env
          echo "BINANCE_TRADER_API_DB_PORT=${BINANCE_TRADER_API_DB_PORT}" >> .env

      - name: Verify .env file
        run: cat .env

      - name: Make scripts executable
        run: |
          chmod +x ./scripts/entrypoint.sh
          chmod +x ./scripts/create-dbs.sh
          chmod +x ./scripts/start
      
      - name: Build and start services
        run: |
          docker-compose build
          docker-compose up -d
          sleep 10

      - name: Setup database and run tests
        run: |
          docker-compose run --rm web ./scripts/create-dbs.sh
          docker-compose run --rm web ./scripts/entrypoint.sh

      - name: Run Django tests with retry
        uses: nick-invision/retry@v2
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: |
            docker-compose build
            docker-compose run --rm web python manage.py test binance_trader_api/tests/
            
      - name: Generate test coverage
        run: |
          docker-compose run --rm web bash -c "
            pip install coverage &&
            coverage run manage.py test binance_trader_api/tests/ &&
            coverage report &&
            coverage html"
            
      - name: Upload test coverage
        uses: actions/upload-artifact@v3
        with:
          name: test-coverage
          path: htmlcov/